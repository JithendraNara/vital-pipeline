# Local dev stack — zero AWS, just containers.
# Brings up MinIO, Iceberg REST, Postgres, and the synthetic cohort API.
# The actual dbt transformations run against DuckDB by default — fast & no external deps.

services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      # Disposable synthetic-local defaults. Override both together if needed.
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin-local-only}"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  mc:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin-local-only}"
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000
      \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb -p local/raw local/silver local/gold local/warehouse || true;
      exit 0;
      "

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on: [minio, postgres]
    environment:
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER:-minioadmin}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-minioadmin-local-only}"
      AWS_REGION: us-east-1
      AWS_S3_ENDPOINT: http://minio:9000
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      JDBC_URI: jdbc:postgresql://postgres:5432/iceberg
      JDBC_USER: iceberg
      JDBC_PASSWORD: "${ICEBERG_POSTGRES_PASSWORD:-iceberg-local-only}"
    ports:
      - "127.0.0.1:8181:8181"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: "${ICEBERG_POSTGRES_PASSWORD:-iceberg-local-only}"
      POSTGRES_DB: iceberg
    volumes:
      - iceberg-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"

  ai-analyst:
    build: ./ai/analyst
    environment:
      DUCKDB_PATH: /app/dbt_project/dbt.duckdb
      DB_SCHEMA: main
      DATA_MODE: synthetic
    volumes:
      - ./dbt_project:/app/dbt_project:ro
      - ./scripts:/app/scripts:ro
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  minio-data:
  iceberg-pg:
